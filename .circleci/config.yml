version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      
      - restore_cache:
          keys:
            - deps-{{ checksum "requirements.txt" }}
            - deps-
      
      - run:
          name: Install dependencies
          command: |
            pip install -r requirements.txt
      
      - save_cache:
          key: deps-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      
      - run:
          name: Run tests
          command: |
            pytest -v

workflows:
  version: 2
  build-test:
    jobs:
      - build-and-test


