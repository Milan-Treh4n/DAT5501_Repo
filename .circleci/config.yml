version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run:
          name: Run unit tests
          command: pytest tests/

workflows:
  version: 2
  build:
    jobs:
      - build


