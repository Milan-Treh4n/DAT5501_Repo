jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-{{ checksum ".circleci/requirements.txt" }}
            - deps-
      - run:
          name: Install dependencies
          command: |
            pip install -r .circleci/requirements.txt
      - save_cache:
          key: deps-{{ checksum ".circleci/requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run tests
          working_directory: .circleci
          command: |
            pytest -v
workflows:
  version: 2
  build-test:
    jobs:
      - build-and-test